trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

variables:
  pythonVersion: "3.13"

steps:
  - checkout: self

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "$(pythonVersion)"
    displayName: "Set up Python $(pythonVersion)"

  - script: |
      python -m pip install --upgrade pip
      pip install -e ".[dev]"
    displayName: "Install dependencies"

  - script: |
      ruff format --check .
    displayName: "Ruff format check"

  - script: |
      ruff check .
    displayName: "Ruff lint"

  - script: |
      mypy .
    displayName: "MyPy type check"

  - script: |
      pytest
    displayName: "Run tests"
