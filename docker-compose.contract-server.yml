services:

  sensor-producer:
    container_name: chain-sensor-producer
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./contract-server/sensor-producer.yaml:/config.yaml:ro
      - ./contracts:/contracts:ro
    command: ["/config.yaml"]
    ports:
      - "8891:8891"
    networks:
      - chain

  alert-responder:
    container_name: chain-alert-responder
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./contract-server/alert-responder.yaml:/config.yaml:ro
      - ./contracts:/contracts:ro
    command: ["/config.yaml"]
    ports:
      - "8892:8892"
    networks:
      - chain

  alert-validator:
    container_name: chain-alert-validator
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./contract-server/alert-validator.yaml:/config.yaml:ro
      - ./contracts:/contracts:ro
    command: ["/config.yaml"]
    ports:
      - "8893:8893"
    networks:
      - chain

networks:
  chain:
    name: chain
