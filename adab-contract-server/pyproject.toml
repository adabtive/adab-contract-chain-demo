[project]
name = "contract-server"
version = "0.1.0"
description = "Config-driven HTTP mock server built on contract-engine"
requires-python = ">=3.13"
authors = [{ name = "Adabtive" }]
license = { text = "Proprietary" }

dependencies = [
    "contract-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "isodate>=0.6",
    "pydantic>=2.6",
    "jinja2>=3.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
contract-server = "contract_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_server"]

[tool.uv.sources]
contract-engine = { path = "../contract_engine", editable = true }

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true
exclude = ["venv", "build", "dist", "__pycache__"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D", "ANN", "C90", "N", "PL", "COM812", "ISC001", "E501",
    "TRY301", "TRY400", "FIX002", "TRY003", "EM102", "EM101",
    "FBT001", "FBT002", "BLE001", "A003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004", "SLF001", "S311", "ARG002"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["venv", "build", "dist", "__pycache__"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[dependency-groups]
dev = [
    "httpx2>=2.3.0",
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "types-pyyaml>=6.0",
]
