display_name: "EnergyPod Producer"
outgoing_base_url: "http://validator:8877"
contracts_dir: /contracts

endpoints:
  emit_to_validator:
    type: generate
    contract: charging_session.json
    refinements:
      status:
        const: "interrupted"
    destination:
      path: /inbound

  emit_invalid_to_validator:
    type: generate
    contract: charging_session.json
    overrides:
      status: "unknown"
    destination:
      path: /inbound

  emit_to_responder:
    type: generate
    contract: charging_session.json
    destination:
      base_url: "http://responder:8877"
      path: /session
